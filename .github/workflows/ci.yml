name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --locked --group docs mkdocs build --strict

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=95
      - name: Test the deprecated toon_format module
        working-directory: packaging/toon-format
        run: uv run --locked --package toon-format pytest --cov --cov-fail-under=95
      - uses: actions/upload-artifact@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build --all-packages
      - name: Smoke test the wheels
        run: |
          uv run --isolated --no-project --with dist/toon_python-*.whl python -c \
            "import toon; assert toon.loads(toon.dumps({'a': [1, 2]})) == {'a': [1, 2]}"
          uv run --isolated --no-project --with dist/toon_python-*.whl toon --version
          uv run --isolated --no-project --with dist/toon_python-*.whl \
            --with dist/toon_format-*.whl python -c \
            "import toon_format; assert toon_format.decode('a: 1') == {'a': 1}"
