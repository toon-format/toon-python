[project]
name = "toon-format"
version = "1.0.0"
description = "Official Python implementation of TOON (Token-Oriented Object Notation), a compact, human-readable encoding of the JSON data model for LLM prompts."
readme = "README.md"
authors = [
    { name = "Johann Schopplich", email = "hello@johannschopplich.com" },
    { name = "Alessio Sanfratello", email = "sanfra90@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["toon", "serialization", "llm", "json", "tokens", "data-format"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://toonformat.dev"
Documentation = "https://toon-python.readthedocs.io"
Repository = "https://github.com/toon-format/toon-python"
Specification = "https://github.com/toon-format/spec/blob/main/SPEC.md"
Changelog = "https://github.com/toon-format/toon-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/toon-format/toon-python/issues"

[project.optional-dependencies]
pydantic = ["pydantic>=2", "typing-extensions>=4.0; python_version < '3.11'"]

[dependency-groups]
dev = [
    "attrs>=23",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "prek>=0.5.4",
    "pydantic>=2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "toons>=0.8",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv.workspace]
# toon-python, an alias distribution with no code that depends on toon-format.
members = ["packaging/toon-python"]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "toon_format"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["toon_format"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 88  # see CONTRIBUTING.md
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PT",   # flake8-pytest-style
    "C4",   # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Expected TOON documents are literal strings that cannot be wrapped.
"tests/**" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["toon_format"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
